<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sombra / Glow ambiental -->
  <defs>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="obsidian-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="amber-fire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="border-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Contenedor Base Squircle redondeado -->
  <rect width="100" height="100" rx="24" fill="#0F0F0F" />
  <rect x="0.5" y="0.5" width="99" height="99" rx="23.5" stroke="#27272A" stroke-opacity="0.6" />

  <!-- Cuerpo de la Q: Cuadrilátero octogonal con bisel de cristal -->
  <!-- Anillo exterior -->
  <path d="M32 20 H68 L80 32 V62 L68 74 H42 L30 62 V32 Z" 
        fill="url(#obsidian-glass)" 
        stroke="url(#border-shine)" 
        stroke-width="1.5" />

  <!-- Hueco interior (anillo concéntrico) -->
  <path d="M42 34 H58 L66 42 V54 L58 62 H42 L34 54 V42 Z" 
        fill="#0F0F0F" 
        stroke="#27272A" 
        stroke-width="1.2" />

  <!-- Cola de la Q: Vector diagonal dinámico hacia arriba a 45 grados (Progreso / Avance) -->
  <polygon points="56,76 88,44 76,44 48,72" 
           fill="url(#amber-fire)" 
           filter="url(#amber-glow)" />

  <!-- Núcleo de luz central de la flecha -->
  <line x1="52" y1="72" x2="84" y2="44" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
